<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>EMI Calculator - Calc Fans</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f4f6fb;
    color: #172033;
}

/* Header */
.header {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    color: white;
    text-align: center;
    padding: 35px 20px;
}

.header h1 {
    margin: 0;
    font-size: 38px;
}

.header p {
    margin: 10px 0 0;
    font-size: 18px;
}

/* Main */
.container {
    width: calc(100% - 40px);
    max-width: 650px;
    margin: 40px auto;
    background: white;
    padding: 40px;
    border-radius: 28px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.08);
}

/* Labels */
label {
    display: block;
    font-size: 25px;
    font-weight: 700;
    margin-bottom: 14px;
}

.field {
    margin-bottom: 38px;
}

/* Inputs */
input {
    width: 100%;
    height: 100px;
    border: 5px solid #dce1e8;
    border-radius: 30px;
    padding: 0 30px;
    font-size: 25px;
    outline: none;
    background: white;
}

input:focus {
    border-color: #3569e8;
}

input.error {
    border-color: #dc2626;
    background: #fff5f5;
}

.error-message {
    color: #dc2626;
    font-size: 18px;
    margin-top: 10px;
    line-height: 1.5;
}

/* Buttons */
button {
    width: 100%;
    height: 85px;
    border: none;
    border-radius: 25px;
    font-size: 25px;
    font-weight: bold;
    color: white;
    cursor: pointer;
    margin-top: 4px;
}

.calculate {
    background: linear-gradient(135deg, #2563eb, #7c3aed);
}

.reset {
    background: #64748b;
    margin-top: 20px;
}

button:active {
    transform: scale(0.98);
}

/* Result */
.result {
    display: none;
    margin-top: 40px;
    padding: 35px;
    border-radius: 28px;
    background: #eef4ff;
}

.result h2 {
    margin: 0 0 35px;
    color: #2864d7;
    font-size: 32px;
}

.result-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    padding: 22px 0;
    border-bottom: 1px solid #d5dce8;
    font-size: 22px;
}

.result-row:last-child {
    border-bottom: none;
}

.result-value {
    font-weight: bold;
    text-align: right;
}

.emi-value {
    color: #172033;
}

.interest-value {
    color: #159447;
}

.total-value {
    color: #2864d7;
}

/* Note */
.note {
    margin-top: 40px;
    padding: 25px;
    background: #eef4ff;
    border-radius: 22px;
    font-size: 18px;
    line-height: 1.7;
    color: #374151;
}

/* Back */
.back {
    display: block;
    text-align: center;
    margin-top: 35px;
    color: #2864d7;
    font-size: 22px;
    font-weight: bold;
    text-decoration: none;
}

/* Laptop / Desktop */
@media (min-width: 768px) {
    .container {
        max-width: 700px;
        padding: 45px;
    }

    label {
        font-size: 24px;
    }

    input {
        height: 85px;
        font-size: 22px;
    }

    button {
        height: 75px;
        font-size: 23px;
    }
}

/* Mobile */
@media (max-width: 600px) {
    .header {
        padding: 25px 15px;
    }

    .header h1 {
        font-size: 30px;
    }

    .header p {
        font-size: 16px;
    }

    .container {
        width: calc(100% - 30px);
        margin: 30px auto;
        padding: 30px 25px;
        border-radius: 28px;
    }

    label {
        font-size: 23px;
    }

    .field {
        margin-bottom: 35px;
    }

    input {
        height: 100px;
        font-size: 22px;
        padding: 0 28px;
        border-radius: 28px;
    }

    button {
        height: 80px;
        font-size: 23px;
        border-radius: 25px;
    }

    .result {
        padding: 28px 25px;
    }

    .result h2 {
        font-size: 30px;
    }

    .result-row {
        font-size: 19px;
    }
}
</style>
</head>

<body>

<header class="header">
    <h1>💰 EMI Calculator</h1>
    <p>Calculate your monthly EMI and total loan cost.</p>
</header>

<main class="container">

    <div class="field">
        <label for="loanAmount">Loan Amount (₹)</label>
        <input
            type="number"
            id="loanAmount"
            placeholder="Example: 500000"
            min="1"
            step="any"
        >
        <div id="loanError" class="error-message"></div>
    </div>

    <div class="field">
        <label for="interestRate">Annual Interest Rate (%)</label>
        <input
            type="number"
            id="interestRate"
            placeholder="Example: 8.5"
            min="0"
            step="any"
        >
        <div id="interestError" class="error-message"></div>
    </div>

    <div class="field">
        <label for="loanTenure">Loan Tenure (Years)</label>
        <input
            type="number"
            id="loanTenure"
            placeholder="Example: 5"
            min="1"
            step="any"
        >
        <div id="tenureError" class="error-message"></div>
    </div>

    <button class="calculate" onclick="calculateEMI()">
        Calculate EMI
    </button>

    <button class="reset" onclick="resetCalculator()">
        Reset
    </button>

    <div id="result" class="result">

        <h2>Loan Result</h2>

        <div class="result-row">
            <span>Monthly EMI</span>
            <span id="monthlyEMI" class="result-value emi-value"></span>
        </div>

        <div class="result-row">
            <span>Total Interest</span>
            <span id="totalInterest" class="result-value interest-value"></span>
        </div>

        <div class="result-row">
            <span>Total Repayment</span>
            <span id="totalPayment" class="result-value total-value"></span>
        </div>

    </div>

    <div class="note">
        ⚠️ EMI results are estimates based on the loan amount,
        interest rate and tenure you enter. Actual loan terms may differ.
    </div>

    <a href="index.html" class="back">
        ← Back to Calc Fans 
    </a>

</main>

<script>
function clearErrors() {
    document.getElementById("loanError").textContent = "";
    document.getElementById("interestError").textContent = "";
    document.getElementById("tenureError").textContent = "";

    document.getElementById("loanAmount").classList.remove("error");
    document.getElementById("interestRate").classList.remove("error");
    document.getElementById("loanTenure").classList.remove("error");
}

function calculateEMI() {

    clearErrors();

    const loanAmount = parseFloat(
        document.getElementById("loanAmount").value
    );

    const interestRate = parseFloat(
        document.getElementById("interestRate").value
    );

    const loanTenure = parseFloat(
        document.getElementById("loanTenure").value
    );

    let valid = true;

    if (isNaN(loanAmount) || loanAmount <= 0) {
        document.getElementById("loanAmount").classList.add("error");
        document.getElementById("loanError").textContent =
            "Please enter a loan amount greater than ₹0.";
        valid = false;
    }

    if (isNaN(interestRate) || interestRate < 0) {
        document.getElementById("interestRate").classList.add("error");
        document.getElementById("interestError").textContent =
            "Please enter an interest rate of 0% or more.";
        valid = false;
    }

    if (isNaN(loanTenure) || loanTenure <= 0) {
        document.getElementById("loanTenure").classList.add("error");
        document.getElementById("tenureError").textContent =
            "Please enter a loan tenure greater than 0 years.";
        valid = false;
    }

    if (!valid) {
        document.getElementById("result").style.display = "none";
        return;
    }

    const monthlyRate = interestRate / 12 / 100;
    const numberOfPayments = loanTenure * 12;

    let emi;

    if (monthlyRate === 0) {
        emi = loanAmount / numberOfPayments;
    } else {
        emi =
            loanAmount *
            monthlyRate *
            Math.pow(1 + monthlyRate, numberOfPayments) /
            (Math.pow(1 + monthlyRate, numberOfPayments) - 1);
    }

    const totalPayment = emi * numberOfPayments;
    const totalInterest = totalPayment - loanAmount;

    document.getElementById("monthlyEMI").textContent =
        "₹" + emi.toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    document.getElementById("totalInterest").textContent =
        "₹" + totalInterest.toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    document.getElementById("totalPayment").textContent =
        "₹" + totalPayment.toLocaleString("en-IN", {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
        });

    document.getElementById("result").style.display = "block";
}

function resetCalculator() {

    document.getElementById("loanAmount").value = "";
    document.getElementById("interestRate").value = "";
    document.getElementById("loanTenure").value = "";

    clearErrors();

    document.getElementById("monthlyEMI").textContent = "";
    document.getElementById("totalInterest").textContent = "";
    document.getElementById("totalPayment").textContent = "";

    document.getElementById("result").style.display = "none";
}
</script>

</body>
</html>
