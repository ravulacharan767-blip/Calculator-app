<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Loan EMI Calculator - SmartCalc</title>
  <meta name="description" content="Free loan EMI calculator to calculate monthly EMI, total interest and total payment.">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8175825864588194"
    crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      width: 94%;
      max-width: 600px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #dbe2ea;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    input.invalid {
      border-color: #dc2626;
      background: #fff5f5;
    }

    .error {
      color: #dc2626;
      font-size: 13px;
      margin-top: 5px;
      min-height: 18px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .reset {
      background: #64748b;
      margin-top: 10px;
    }

    .results {
      display: none;
      margin-top: 25px;
    }

    .result-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      border-left: 5px solid #2563eb;
    }

    .result-box span {
      display: block;
      color: #64748b;
      font-size: 14px;
    }

    .result-box strong {
      display: block;
      font-size: 23px;
      margin-top: 3px;
    }

    .interest {
      border-left-color: #16a34a;
    }

    .interest strong {
      color: #16a34a;
    }

    .note {
      background: #eff6ff;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #334155;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 26px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>💰 Loan EMI Calculator</h1>
  <p>Calculate your monthly EMI and total loan cost</p>
</header>

<div class="container">

  <div class="card">

    <!-- Loan Amount -->
    <div class="input-group">
      <label for="loanAmount">Loan Amount (₹)</label>

      <input
        type="number"
        id="loanAmount"
        placeholder="Example: 500000"
        min="1"
        step="1"
      >

      <div class="error" id="loanAmountError"></div>
    </div>


    <!-- Interest Rate -->
    <div class="input-group">
      <label for="interestRate">Annual Interest Rate (%)</label>

      <input
        type="number"
        id="interestRate"
        placeholder="Example: 8.5"
        min="0"
        max="100"
        step="0.01"
      >

      <div class="error" id="interestRateError"></div>
    </div>


    <!-- Loan Tenure -->
    <div class="input-group">
      <label for="loanYears">Loan Tenure (Years)</label>

      <input
        type="number"
        id="loanYears"
        placeholder="Example: 5"
        min="1"
        max="100"
        step="1"
      >

      <div class="error" id="loanYearsError"></div>
    </div>


    <button onclick="calculateEMI()">
      Calculate EMI
    </button>

    <button class="reset" onclick="resetCalculator()">
      Reset
    </button>


    <!-- Results -->
    <div class="results" id="results">

      <div class="result-box">
        <span>Monthly EMI</span>
        <strong id="monthlyEMI">₹0</strong>
      </div>

      <div class="result-box interest">
        <span>Total Interest</span>
        <strong id="totalInterest">₹0</strong>
      </div>

      <div class="result-box">
        <span>Total Payment</span>
        <strong id="totalPayment">₹0</strong>
      </div>

    </div>


    <div class="note">
      ⚠️ EMI results are estimates based on the loan amount, interest rate
      and tenure you enter. Actual loan terms may differ.
    </div>

  </div>

</div>

<footer>
  © 2026 SmartCalc — Loan EMI Calculator
</footer>


<script>

  // Format Indian Rupees
  function formatMoney(number) {
    return "₹" + Math.round(number).toLocaleString("en-IN");
  }


  // Show error message
  function showError(id, message) {
    document.getElementById(id).classList.add("invalid");
    document.getElementById(id + "Error").textContent = message;
  }


  // Clear error when typing
  document.getElementById("loanAmount").addEventListener("input", function () {
    this.classList.remove("invalid");
    document.getElementById("loanAmountError").textContent = "";
  });

  document.getElementById("interestRate").addEventListener("input", function () {
    this.classList.remove("invalid");
    document.getElementById("interestRateError").textContent = "";
  });

  document.getElementById("loanYears").addEventListener("input", function () {
    this.classList.remove("invalid");
    document.getElementById("loanYearsError").textContent = "";
  });


  // Calculate EMI
  function calculateEMI() {

    const loanAmount = parseFloat(
      document.getElementById("loanAmount").value
    );

    const annualRate = parseFloat(
      document.getElementById("interestRate").value
    );

    const years = parseFloat(
      document.getElementById("loanYears").value
    );


    // Clear previous errors
    document.querySelectorAll(".error").forEach(function (error) {
      error.textContent = "";
    });

    document.querySelectorAll("input").forEach(function (input) {
      input.classList.remove("invalid");
    });


    let valid = true;


    // Loan amount validation
    if (
      isNaN(loanAmount) ||
      loanAmount <= 0
    ) {
      showError(
        "loanAmount",
        "Please enter a loan amount greater than ₹0."
      );

      valid = false;
    }


    // Interest rate validation
    if (
      isNaN(annualRate) ||
      annualRate < 0 ||
      annualRate > 100
    ) {
      showError(
        "interestRate",
        "Please enter an interest rate between 0% and 100%."
      );

      valid = false;
    }


    // Tenure validation
    if (
      isNaN(years) ||
      years <= 0 ||
      years > 100
    ) {
      showError(
        "loanYears",
        "Please enter a tenure between 1 and 100 years."
      );

      valid = false;
    }


    // Stop if invalid
    if (!valid) {
      document.getElementById("results").style.display = "none";
      return;
    }


    // Total number of months
    const months = years * 12;


    // Monthly interest rate
    const monthlyRate = annualRate / 12 / 100;


    let emi;


    // 0% interest special case
    if (monthlyRate === 0) {

      emi = loanAmount / months;

    } else {

      emi =
        loanAmount *
        monthlyRate *
        Math.pow(1 + monthlyRate, months)
        /
        (Math.pow(1 + monthlyRate, months) - 1);

    }


    // Total payment
    const totalPayment = emi * months;


    // Total interest
    const totalInterest = totalPayment - loanAmount;


    // Display results
    document.getElementById("monthlyEMI").textContent =
      formatMoney(emi);

    document.getElementById("totalInterest").textContent =
      formatMoney(totalInterest);

    document.getElementById("totalPayment").textContent =
      formatMoney(totalPayment);


    // Show results
    document.getElementById("results").style.display = "block";
  }


  // Reset calculator
  function resetCalculator() {

    document.getElementById("loanAmount").value = "";
    document.getElementById("interestRate").value = "";
    document.getElementById("loanYears").value = "";


    document.querySelectorAll("input").forEach(function (input) {
      input.classList.remove("invalid");
    });


    document.querySelectorAll(".error").forEach(function (error) {
      error.textContent = "";
    });


    document.getElementById("results").style.display = "none";
  }

</script>

</body>
</html>
