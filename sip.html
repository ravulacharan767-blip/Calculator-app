<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SIP Calculator - SmartCalc</title>
  <meta name="description" content="Free SIP calculator to calculate total investment, estimated returns and future value.">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8175825864588194"
    crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      line-height: 1.6;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      font-size: 30px;
      margin-bottom: 5px;
    }

    header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      width: 94%;
      max-width: 600px;
      margin: 30px auto;
    }

    .card {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 2px solid #dbe2ea;
      border-radius: 10px;
      font-size: 16px;
      outline: none;
      transition: 0.2s;
    }

    input:focus {
      border-color: #2563eb;
    }

    input.invalid {
      border-color: #dc2626;
      background: #fff5f5;
    }

    .error {
      color: #dc2626;
      font-size: 13px;
      margin-top: 5px;
      min-height: 18px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    .reset {
      background: #64748b;
      margin-top: 10px;
    }

    .results {
      display: none;
      margin-top: 25px;
    }

    .result-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 12px;
      border-left: 5px solid #2563eb;
    }

    .result-box span {
      display: block;
      color: #64748b;
      font-size: 14px;
    }

    .result-box strong {
      display: block;
      font-size: 23px;
      margin-top: 3px;
    }

    .profit {
      border-left-color: #16a34a;
    }

    .profit strong {
      color: #16a34a;
    }

    .note {
      background: #eff6ff;
      padding: 12px;
      border-radius: 10px;
      font-size: 13px;
      color: #334155;
      margin-top: 20px;
    }

    footer {
      text-align: center;
      padding: 25px;
      color: #64748b;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 26px;
      }

      .card {
        padding: 20px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>📈 SIP Calculator</h1>
  <p>Calculate your estimated SIP returns</p>
</header>

<div class="container">

  <div class="card">

    <!-- Monthly Investment -->
    <div class="input-group">
      <label for="monthly">Monthly Investment (₹)</label>

      <input
        type="number"
        id="monthly"
        placeholder="Example: 5000"
        min="1"
        step="1"
      >

      <div class="error" id="monthlyError"></div>
    </div>

    <!-- Expected Return -->
    <div class="input-group">
      <label for="rate">Expected Annual Return (%)</label>

      <input
        type="number"
        id="rate"
        placeholder="Example: 12"
        min="0"
        max="100"
        step="0.01"
      >

      <div class="error" id="rateError"></div>
    </div>

    <!-- Investment Period -->
    <div class="input-group">
      <label for="years">Investment Period (Years)</label>

      <input
        type="number"
        id="years"
        placeholder="Example: 10"
        min="1"
        max="100"
        step="1"
      >

      <div class="error" id="yearsError"></div>
    </div>

    <button onclick="calculateSIP()">
      Calculate SIP
    </button>

    <button class="reset" onclick="resetCalculator()">
      Reset
    </button>

    <!-- Results -->
    <div class="results" id="results">

      <div class="result-box">
        <span>Total Investment</span>
        <strong id="totalInvestment">₹0</strong>
      </div>

      <div class="result-box profit">
        <span>Estimated Returns</span>
        <strong id="estimatedReturns">₹0</strong>
      </div>

      <div class="result-box">
        <span>Estimated Future Value</span>
        <strong id="futureValue">₹0</strong>
      </div>

    </div>

    <div class="note">
      ⚠️ SIP returns are estimates based on the expected annual return you enter.
      Actual market returns may be different.
    </div>

  </div>

</div>

<footer>
  © 2026 SmartCalc — SIP Calculator
</footer>

<script>

  // Format number as Indian Rupees
  function formatMoney(number) {
    return "₹" + Math.round(number).toLocaleString("en-IN");
  }


  // Clear error when user starts typing
  document.getElementById("monthly").addEventListener("input", function () {
    this.classList.remove("invalid");
    document.getElementById("monthlyError").textContent = "";
  });

  document.getElementById("rate").addEventListener("input", function () {
    this.classList.remove("invalid");
    document.getElementById("rateError").textContent = "";
  });

  document.getElementById("years").addEventListener("input", function () {
    this.classList.remove("invalid");
    document.getElementById("yearsError").textContent = "";
  });


  // Show error
  function showError(id, message) {
    document.getElementById(id).classList.add("invalid");
    document.getElementById(id + "Error").textContent = message;
  }


  // SIP Calculation
  function calculateSIP() {

    const monthly = parseFloat(
      document.getElementById("monthly").value
    );

    const annualRate = parseFloat(
      document.getElementById("rate").value
    );

    const years = parseFloat(
      document.getElementById("years").value
    );


    // Clear previous errors
    document.querySelectorAll(".error").forEach(function (element) {
      element.textContent = "";
    });

    document.querySelectorAll("input").forEach(function (input) {
      input.classList.remove("invalid");
    });


    let valid = true;


    // Monthly investment validation
    if (
      isNaN(monthly) ||
      monthly <= 0
    ) {
      showError(
        "monthly",
        "Please enter a monthly investment greater than ₹0."
      );

      valid = false;
    }


    // Annual return validation
    if (
      isNaN(annualRate) ||
      annualRate < 0 ||
      annualRate > 100
    ) {
      showError(
        "rate",
        "Please enter a return between 0% and 100%."
      );

      valid = false;
    }


    // Years validation
    if (
      isNaN(years) ||
      years <= 0 ||
      years > 100
    ) {
      showError(
        "years",
        "Please enter a period between 1 and 100 years."
      );

      valid = false;
    }


    // Stop if validation fails
    if (!valid) {
      document.getElementById("results").style.display = "none";
      return;
    }


    // Number of months
    const months = years * 12;


    // Monthly interest rate
    const monthlyRate = annualRate / 12 / 100;


    let futureValue;


    // If return is 0%
    if (monthlyRate === 0) {

      futureValue = monthly * months;

    } else {

      futureValue =
        monthly *
        (
          (Math.pow(1 + monthlyRate, months) - 1)
          / monthlyRate
        ) *
        (1 + monthlyRate);

    }


    // Total amount invested
    const totalInvestment = monthly * months;


    // Profit / estimated returns
    const estimatedReturns =
      futureValue - totalInvestment;


    // Display results
    document.getElementById("totalInvestment").textContent =
      formatMoney(totalInvestment);

    document.getElementById("estimatedReturns").textContent =
      formatMoney(estimatedReturns);

    document.getElementById("futureValue").textContent =
      formatMoney(futureValue);


    // Show results
    document.getElementById("results").style.display = "block";
  }


  // Reset calculator
  function resetCalculator() {

    document.getElementById("monthly").value = "";
    document.getElementById("rate").value = "";
    document.getElementById("years").value = "";


    document.querySelectorAll("input").forEach(function (input) {
      input.classList.remove("invalid");
    });


    document.querySelectorAll(".error").forEach(function (error) {
      error.textContent = "";
    });


    document.getElementById("results").style.display = "none";
  }

</script>

</body>
</html>
